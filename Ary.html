<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flower with Bee</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.1.0/anime.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      padding: 0;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: hsl(40, 45%, 80%);
      color: hsl(0, 0%, 15%);
      /* padding-bottom: 100px; */
    }

    svg {
      color: hsl(115, 97%, 25%);
      width: 80vw;
      max-width: 35rem;
      width: 100%;
      height: auto;
      display: block;
    }

    svg#bee {
      color: hsl(0, 0%, 10%);
      position: absolute;
      width: 50px;
      height: auto;
    }

    .text {
      font-size: clamp(2rem, 4vw, 3rem);
      width: 100%;
      text-align: center;
      position: fixed;
      top: 23%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;

      animation: fade-in forwards 0.5s;
      animation-delay: 2s;
    }

    @keyframes fade-in {
      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    @media (width <=600px) {
      .text {
        top: 28%;
      }
    }

    .music-player {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 999px;
      background: hsl(40, 45%, 80%);
      border: 2px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.06);
    }

    .music-btn {
      width: 22px;
      height: 22px;
      border: 2px solid rgba(0, 0, 0, 0.12);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.04);
      color: rgba(0, 0, 0, 0.75);
      display: grid;
      place-items: center;
      font-size: 10px;
      cursor: pointer;
      padding: 0;
      user-select: none;
    }

    .music-btn.play {
      width: 28px;
      height: 28px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.06);
    }

    #bgAudio {
      display: none;
    }
  </style>
</head>

<body>
  <h1 class="text">
    Flower For You!
  </h1>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="-25 0 150 100" width="150" height="150">
    <defs>
      <mask id="mask-petals">
        <rect width="100" height="100" fill="hsl(0, 0%, 100%)" />
        <g transform="translate(50 40)">
          <g class="petals">
            <circle r="11" fill="hsl(0, 0%, 0%)" />
          </g>
        </g>
      </mask>
    </defs>
    <g transform="translate(50 98)">
      <g class="stem" transform="scale(1 1)">
        <g fill="currentColor">
          <g class="leaf" transform="rotate(45)">
            <path d="M 0 0 c 20 -8 15 -32 0 -42 -15 10 -20 34 0 42" />
          </g>
          <g transform="scale(-1 1)">
            <g class="leaf" transform="rotate(45)">
              <path d="M 0 0 c 20 -8 15 -32 0 -42 -15 10 -20 34 0 42" />
            </g>
          </g>
        </g>
      </g>
    </g>

    <g mask="url(#mask-petals)">
      <g transform="translate(50 40)">
        <g fill="hsl(0, 75%, 50%)">
          <g class="petals">
            <circle transform="translate(0 -14)" r="11" />
            <circle transform="rotate(72) translate(0 -14)" r="11" />
            <circle transform="rotate(144) translate(0 -14)" r="11" />
            <circle transform="rotate(216) translate(0 -14)" r="11" />
            <circle transform="rotate(288) translate(0 -14)" r="11" />
          </g>
        </g>
      </g>
    </g>

    <text id="ary-text" x="50" y="40" text-anchor="middle" font-size="8" font-weight="bold" fill="hsl(0, 0%, 20%)" opacity="0">
      Ary
    </text>

    <!-- still unclear about the path accepted by anime.js -->
    <path id="path" stroke="none" fill="none"
      d="M -25 -20 a 30 30 0 0 0 60 0 30 30 0 0 0 -60 0 30 30 0 0 1 -60 0 30 30 0 0 1 60 0" />
  </svg>

  <svg id="bee" viewBox="-10.5 -10.5 21 21" style="width: 50px; height: auto">
    <g transform="rotate(90) translate(0 -4)">
      <g stroke="currentColor">
        <circle fill="currentColor" r="4" stroke-width="2.5" />
        <g fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path transform="rotate(45) translate(0 -4)" d="M 0 0 v -3" />
          <path transform="rotate(-45) translate(0 -4)" d="M 0 0 v -3" />
          <g fill="hsl(200, 80%, 90%)">
            <path transform="rotate(15)" d="M 0 0 h 7 a 3 3 0 0 1 0 6 q -4 0 -7 -6" />
            <path transform="scale(-1 1) rotate(15)" d="M 0 0 h 7 a 3 3 0 0 1 0 6 q -4 0 -7 -6" />
          </g>
          <g fill="hsl(50, 80%, 50%)">
            <path d="M 0 0 c 2 6 8 10 0 12 -8 -2 -2 -6 0 -12" />
          </g>
        </g>
      </g>
    </g>
  </svg>

  <script>
    const path = anime.path("#path");

    const timeline = anime.timeline({
      easing: "easeInOutExpo",
      duration: 1000,
      complete: () => {
        anime({
          targets: ".leaf",
          rotate: 40,
          duration: 3000,
          loop: true,
          direction: "alternate",
          easing: "easeInOutQuad",
        });
        anime({
          targets: ".petals",
          scale: 1.05,
          duration: 6000,
          loop: true,
          direction: "alternate",
          easing: "easeInOutQuad",
        });
      },
    });

    timeline.add({
      targets: ".stem",
      scale: [0, 1],
    });

    timeline.add({
      targets: ".leaf",
      rotate: [0, 45],
    });
    timeline.add(
      {
        targets: ".petals",
        scale: [0, 1],
      },
      "-=1000",
    );

    timeline.add(
      {
        targets: "#bee",
        opacity: [0, 1],
      },
      "-=750",
    );

    timeline.add(
      {
        targets: "#ary-text",
        opacity: [0, 1],
        scale: [0.5, 1],
      },
      "+=1500",
    );

    anime({
      targets: "#bee",
      translateX: path("x"),
      translateY: path("y"),
      rotate: path("angle"),
      loop: true,
      duration: 12500,
      easing: "linear",
    });
  </script>

  <audio id="bgAudio" autoplay loop preload="auto">
    <source src="Download.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <div class="music-player" aria-label="music controls">
    <button class="music-btn" type="button" aria-label="previous">◀</button>
    <button class="music-btn play" id="playBtn" type="button" aria-label="play or pause">❚❚</button>
    <button class="music-btn" type="button" aria-label="next">▶</button>
    <button class="music-btn" id="muteBtn" type="button" aria-label="mute">🔊</button>
  </div>

  <script>
    const bgAudio = document.getElementById('bgAudio');
    const playBtn = document.getElementById('playBtn');
    const muteBtn = document.getElementById('muteBtn');

    bgAudio.volume = 0.2;

    const updatePlayState = () => {
      playBtn.textContent = bgAudio.paused ? '▶' : '❚❚';
    };

    const updateMuteState = () => {
      muteBtn.textContent = bgAudio.muted ? '🔇' : '🔊';
    };

    playBtn.addEventListener('click', () => {
      if (bgAudio.paused) bgAudio.play().catch(() => {});
      else bgAudio.pause();
      updatePlayState();
    });

    muteBtn.addEventListener('click', () => {
      bgAudio.muted = !bgAudio.muted;
      updateMuteState();
    });

    bgAudio.addEventListener('play', updatePlayState);
    bgAudio.addEventListener('pause', updatePlayState);
    bgAudio.addEventListener('volumechange', updateMuteState);

    updatePlayState();
    updateMuteState();
  </script>
</body>

</html>
