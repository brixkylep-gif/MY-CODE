<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HAPPY BIRTHDAY VIEN</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      font-family: 'Impact', sans-serif;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
      pointer-events: none;
    }

    #matrixCanvas { z-index: 0; }
    #cakeCanvas { z-index: 3; }
    #confettiCanvas { z-index: 5; }

    .popup, #messageContainer div {
      position: fixed;
      width: 100%;
      text-align: center;
      top: 20%; /* Moved up above cake */
      font-size: 3.5rem;
      color: #3fa5cd;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 6px;
      z-index: 10;
      animation: zoomIn 0.6s ease-in-out;
      opacity: 1;
      transition: opacity 1s ease-out;
      text-shadow:
        0 0 8px rgba(255, 222, 173, 0.8),
        0 0 20px rgba(205, 133, 63, 0.7),
        0 0 30px rgba(205, 133, 63, 0.5);
    }

    .paused {
      animation-play-state: paused !important;
      transition: none !important;
    }

    body.is-paused .popup,
    body.is-paused #messageContainer div,
    body.is-paused #imageContainer img,
    body.is-paused .image-popup,
    body.is-paused .image-popup-right,
    body.is-paused .image-popup-bottom-left,
    body.is-paused .image-popup-bottom-right,
    body.is-paused .image-popup-vien4 {
      animation-play-state: paused !important;
      transition: none !important;
    }

    #messageContainer div {
      font-size: 4.5rem;
    }

    .image-popup {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
      animation: zoomIn 0.6s ease-in-out;
      opacity: 1;
      transition: opacity 1s ease-out;
      max-width: 200px;
      max-height: 200px;
    }

    .image-popup-right {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10;
      animation: zoomIn 0.6s ease-in-out;
      opacity: 1;
      transition: opacity 1s ease-out;
      max-width: 200px;
      max-height: 200px;
    }

    .image-popup-bottom-left {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 10;
      animation: zoomIn 0.6s ease-in-out;
      opacity: 1;
      transition: opacity 1s ease-out;
      max-width: 200px;
      max-height: 200px;
    }

    .image-popup-bottom-right {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 10;
      animation: zoomIn 0.6s ease-in-out;
      opacity: 1;
      transition: opacity 1s ease-out;
      max-width: 200px;
      max-height: 200px;
    }

    @keyframes zoomIn {
      from {
        transform: scale(0.7);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes floatUp {
      from {
        transform: translateY(0);
        opacity: 1;
      }
      to {
        transform: translateY(-100px);
        opacity: 1;
      }
    }

    @keyframes floatUpOverCake {
      0% {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }
      100% {
        transform: translateX(-50%) translateY(-300px);
        opacity: 0;
      }
    }

    .float-up {
      animation: floatUp 3s ease-in-out infinite;
    }

    .image-popup-vien4 {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 2;
      animation: zoomIn 0.6s ease-in-out;
      max-width: 300px;
      max-height: 300px;
    }

    .control-buttons {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 15;
      display: flex;
      gap: 8px;
    }

    .control-button {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #3fa5cd, #2d7fa3);
      color: white;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(63, 165, 205, 0.3);
    }

    .control-button:hover {
      background: linear-gradient(135deg, #4eb8e0, #3d92bd);
      box-shadow: 0 6px 20px rgba(63, 165, 205, 0.5);
      transform: translateY(-2px);
    }

    .control-button:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(63, 165, 205, 0.3);
    }
  </style>
</head>
  <body>
    <audio id="birthdayAudio" autoplay loop muted>
      <source src="Images/Download (2).mp3" type="audio/mpeg">
    </audio>
    
    <div class="control-buttons">
      <button class="control-button" id="playPauseBtn" title="Play/Pause">⏸</button>
      <button class="control-button" id="muteBtn" title="Mute">🔊</button>
    </div>

    <canvas id="matrixCanvas"></canvas>
    <canvas id="cakeCanvas"></canvas>
    <canvas id="confettiCanvas"></canvas>

    <div id="popupContainer"></div>
    <div id="timer" class="popup">3</div>
    <div id="messageContainer"></div>
    <div id="imageContainer"></div>

    <script>
      // === Global Pause State ===
      let isPaused = false;

      // === Matrix Rain Setup ===
      const matrixCanvas = document.getElementById("matrixCanvas");
      const ctx = matrixCanvas.getContext("2d");
      matrixCanvas.width = window.innerWidth;
      matrixCanvas.height = window.innerHeight;

      const chars = "アカサタナハマヤラワ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
      const fontSize = 16;
      const columns = Math.floor(matrixCanvas.width / fontSize);
      const drops = Array(columns).fill(1);

      function drawMatrix() {
        if (isPaused) return;
        
        ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
        ctx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
        ctx.fillStyle = "#cd853f";
        ctx.font = fontSize + "px monospace";

        drops.forEach((y, i) => {
          const text = chars[Math.floor(Math.random() * chars.length)];
          ctx.fillText(text, i * fontSize, y * fontSize);
          if (y * fontSize > matrixCanvas.height && Math.random() > 0.975) drops[i] = 0;
          drops[i]++;
        });
      }

      setInterval(drawMatrix, 33);

      // === Confetti Setup ===
      const confettiCanvas = document.getElementById("confettiCanvas");
      const confettiCtx = confettiCanvas.getContext("2d");
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;

      let confettiParticles = [];

      function createConfetti(x, y) {
        const colors = ['#ff0', '#f0f', '#0ff', '#f55', '#5f5', '#55f'];
        for (let i = 0; i < 100; i++) {
          confettiParticles.push({
            x: x + (Math.random() - 0.5) * 50,
            y: y + (Math.random() - 0.5) * 50,
            dx: (Math.random() - 0.5) * 4,
            dy: Math.random() * -5 - 2,
            color: colors[Math.floor(Math.random() * colors.length)],
            size: Math.random() * 4 + 2,
            life: 100
          });
        }
      }

      function drawConfetti() {
        if (!isPaused) {
          confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
          confettiParticles = confettiParticles.filter(p => p.life > 0);
          confettiParticles.forEach(p => {
            confettiCtx.fillStyle = p.color;
            confettiCtx.fillRect(p.x, p.y, p.size, p.size);
            p.x += p.dx;
            p.y += p.dy;
            p.dy += 0.1;
            p.life--;
          });
        }
        requestAnimationFrame(drawConfetti);
      }
      drawConfetti();

      // === Cake Drawing Setup ===
      const cakeCanvas = document.getElementById("cakeCanvas");
      const cakeCtx = cakeCanvas.getContext("2d");
      cakeCanvas.width = window.innerWidth;
      cakeCanvas.height = window.innerHeight;

      const cakeWidth = 240;
      const cakeHeight = 180;
      let cx = 0;
      let cy = 0;
      let cakeScale = 1;

      function resizeCake() {
        cakeCanvas.width = window.innerWidth;
        cakeCanvas.height = window.innerHeight;
        cakeScale = Math.min(
          1,
          (cakeCanvas.width - 32) / cakeWidth,
          (cakeCanvas.height - 32) / cakeHeight,
        );
        cx = cakeCanvas.width / 2;
        cy = cakeCanvas.height / 2 + Math.min(100, cakeCanvas.height * 0.12);
      }

      function withCakeTransform(draw) {
        cakeCtx.save();
        cakeCtx.translate(cx, cy);
        cakeCtx.scale(cakeScale, cakeScale);
        draw();
        cakeCtx.restore();
      }

      // Draw cake base
      function drawCakeBase() {
        withCakeTransform(() => {
          // Cake body
          cakeCtx.fillStyle = "#f4a460";
          cakeCtx.fillRect(-100, -30, 200, 60);

          // Cake top layer
          cakeCtx.fillStyle = "#deb887";
          cakeCtx.fillRect(-80, -70, 160, 40);

          // Frosting on top
          cakeCtx.fillStyle = "#fff";
          cakeCtx.beginPath();
          cakeCtx.moveTo(-80, -70);
          cakeCtx.quadraticCurveTo(0, -100, 80, -70);
          cakeCtx.lineTo(80, -65);
          cakeCtx.quadraticCurveTo(0, -95, -80, -65);
          cakeCtx.closePath();
          cakeCtx.fill();

          // Plate ellipse
          cakeCtx.strokeStyle = "#ccc";
          cakeCtx.lineWidth = 4;
          cakeCtx.beginPath();
          cakeCtx.ellipse(0, 35, 120, 10, 0, 0, Math.PI * 2);
          cakeCtx.stroke();
        });
      }

      // Toppings helper functions
      function drawBerry(x, y, color) {
        cakeCtx.beginPath();
        cakeCtx.fillStyle = color;
        cakeCtx.arc(x, y, 8, 0, Math.PI * 2);
        cakeCtx.fill();
      }

      function drawCream(x, y) {
        cakeCtx.beginPath();
        cakeCtx.fillStyle = "white";
        cakeCtx.ellipse(x, y, 10, 6, 0, 0, Math.PI * 2);
        cakeCtx.fill();
      }

      function drawCherry(x, y) {
        drawBerry(x, y, "crimson");
        cakeCtx.beginPath();
        cakeCtx.strokeStyle = "#006400";
        cakeCtx.lineWidth = 2;
        cakeCtx.moveTo(x, y);
        cakeCtx.lineTo(x, y - 10);
        cakeCtx.stroke();
      }

      // Array of topping steps for each message index
      const cakeToppings = [
        () => { 
          drawBerry(-60, -80, "red"); drawBerry(60, -80, "red"); 
          drawBerry(-30, -85, "pink"); drawBerry(30, -85, "pink"); 
          drawCream(-15, -90); drawCream(15, -90); 
        },
        () => { drawBerry(0, -92, "#87ceeb"); },
        () => { drawCherry(-45, -70); drawCherry(45, -70); },
        () => { drawCherry(0, -100); },
        () => { drawBerry(-60, -60, "#ffa500"); drawBerry(60, -60, "#ffa500"); },
        () => {
          // Draw candles spelling "23RD"
          const candleX = [-45, -15, 15, 45];
          const letters = ["2", "3", "R", "D"];

          candleX.forEach((dx, i) => {
            const x = dx;
            const y = -110;

            // Candle body
            cakeCtx.fillStyle = "#ff69b4";
            cakeCtx.fillRect(x - 5, y, 10, 40);

            // Candle top rim for depth
            cakeCtx.fillStyle = "#ffb6c1";
            cakeCtx.fillRect(x - 5, y, 10, 3);

            // Flickering flame - outer glow
            cakeCtx.beginPath();
            cakeCtx.fillStyle = "rgba(255, 215, 0, 0.9)";
            cakeCtx.ellipse(x, y - 10, 5, 10, 0, 0, Math.PI * 2);
            cakeCtx.fill();

            // Flickering flame - inner glow
            cakeCtx.beginPath();
            cakeCtx.fillStyle = "rgba(255, 140, 0, 0.6)";
            cakeCtx.ellipse(x, y - 10, 2, 5, 0, 0, Math.PI * 2);
            cakeCtx.fill();

            // Glow effect (soft light)
            cakeCtx.shadowColor = "gold";
            cakeCtx.shadowBlur = 15;

            // Candle letter
            cakeCtx.shadowBlur = 0;
            cakeCtx.fillStyle = "#000";
            cakeCtx.font = "bold 18px Arial";
            cakeCtx.textAlign = "center";
            cakeCtx.fillText(letters[i], x, y - 15);
          });

          // Reset shadow after candles
          cakeCtx.shadowBlur = 0;
        },
        () => {
          // Draw candle with "V" for VIEN
          const x = 0;
          const y = -110;

          // Candle body
          cakeCtx.fillStyle = "#ff69b4";
          cakeCtx.fillRect(x - 5, y, 10, 40);

          // Candle top rim for depth
          cakeCtx.fillStyle = "#ffb6c1";
          cakeCtx.fillRect(x - 5, y, 10, 3);

          // Flickering flame - outer glow
          cakeCtx.beginPath();
          cakeCtx.fillStyle = "rgba(255, 215, 0, 0.9)";
          cakeCtx.ellipse(x, y - 10, 5, 10, 0, 0, Math.PI * 2);
          cakeCtx.fill();

          // Flickering flame - inner glow
          cakeCtx.beginPath();
          cakeCtx.fillStyle = "rgba(255, 140, 0, 0.6)";
          cakeCtx.ellipse(x, y - 10, 2, 5, 0, 0, Math.PI * 2);
          cakeCtx.fill();

          // Glow effect (soft light)
          cakeCtx.shadowColor = "gold";
          cakeCtx.shadowBlur = 15;

          // Candle letter
          cakeCtx.shadowBlur = 0;
          cakeCtx.fillStyle = "#000";
          cakeCtx.font = "bold 18px Arial";
          cakeCtx.textAlign = "center";
          cakeCtx.fillText("V", x, y - 15);

          // Reset shadow after candle
          cakeCtx.shadowBlur = 0;
        }
      ];
      let toppingsShown = 0;

      // === DOM Elements for Text & Timing ===
      const popupContainer = document.getElementById("popupContainer");
      const timerEl = document.getElementById("timer");
      const messageContainer = document.getElementById("messageContainer");

      const dateNow = new Date();
      const formattedDate = dateNow.toLocaleDateString(undefined, {
        year: "numeric",
        month: "long",
        day: "numeric",
      });

      const introMessages = [formattedDate, "IT'S YOUR DAY!"];
      const mainMessages = ["HAPPYBIRTH", "DAY", "TO", "YOU", "VIEN"];
      const finalMessages = ["ARE", "YOU", "READY?"];

      timerEl.style.display = "none";

      function showPopupText(text, target) {
        const el = document.createElement("div");
        el.classList.add("popup");
        el.textContent = text;
        target.appendChild(el);

        // Center confetti at center of viewport
        createConfetti(window.innerWidth / 2, window.innerHeight / 2);

        setTimeout(() => {
          el.style.opacity = 0;
          setTimeout(() => el.remove(), 1000);
        }, 2000);
      }

      function showPopupImage() {
        const imageContainer = document.getElementById("imageContainer");
        const img = document.createElement("img");
        img.src = "images/vien.jpg";
        img.classList.add("image-popup");
        imageContainer.appendChild(img);

        // Center confetti at center of viewport
        createConfetti(window.innerWidth / 2, window.innerHeight / 2);

        setTimeout(() => {
          img.style.opacity = 0;
          setTimeout(() => {
            img.remove();
            showPopupImageRight();
          }, 1000);
        }, 2000);
      }

      function showPopupImageRight() {
        const imageContainer = document.getElementById("imageContainer");
        const img = document.createElement("img");
        img.src = "images/vien2.jpg";
        img.classList.add("image-popup-right");
        imageContainer.appendChild(img);

        // Center confetti at center of viewport
        createConfetti(window.innerWidth / 2, window.innerHeight / 2);

        setTimeout(() => {
          img.style.opacity = 0;
          setTimeout(() => {
            img.remove();
            showPopupImageBottomLeft();
          }, 1000);
        }, 2000);
      }

      function showPopupImageBottomLeft() {
        const imageContainer = document.getElementById("imageContainer");
        const img = document.createElement("img");
        img.src = "images/vien3.jpg";
        img.classList.add("image-popup-bottom-left");
        imageContainer.appendChild(img);

        // Center confetti at center of viewport
        createConfetti(window.innerWidth / 2, window.innerHeight / 2);

        setTimeout(() => {
          img.style.opacity = 0;
          setTimeout(() => {
            img.remove();
            showPopupImageBottomRight();
          }, 1000);
        }, 2000);
      }

      function showPopupImageBottomRight() {
        const imageContainer = document.getElementById("imageContainer");
        const img = document.createElement("img");
        img.src = "images/vien4.jpg";
        img.classList.add("image-popup-bottom-right");
        imageContainer.appendChild(img);

        // Center confetti at center of viewport
        createConfetti(window.innerWidth / 2, window.innerHeight / 2);

        setTimeout(() => {
          img.style.opacity = 0;
          setTimeout(() => {
            img.remove();
            showAllImagesSimultaneously();
          }, 1000);
        }, 2000);
      }

      function showAllImagesSimultaneously() {
        const imageContainer = document.getElementById("imageContainer");
        
        // Show all 4 images at once
        const img1 = document.createElement("img");
        img1.src = "images/vien.jpg";
        img1.classList.add("image-popup");
        imageContainer.appendChild(img1);

        const img2 = document.createElement("img");
        img2.src = "images/vien2.jpg";
        img2.classList.add("image-popup-right");
        imageContainer.appendChild(img2);

        const img3 = document.createElement("img");
        img3.src = "images/vien3.jpg";
        img3.classList.add("image-popup-bottom-left");
        imageContainer.appendChild(img3);

        const img4 = document.createElement("img");
        img4.src = "images/vien4.jpg";
        img4.classList.add("image-popup-bottom-right");
        imageContainer.appendChild(img4);

        // Center confetti at center of viewport
        createConfetti(window.innerWidth / 2, window.innerHeight / 2);

        setTimeout(() => {
          img1.style.opacity = 0;
          img2.style.opacity = 0;
          img3.style.opacity = 0;
          img4.style.opacity = 0;
          setTimeout(() => {
            img1.remove();
            img2.remove();
            img3.remove();
            img4.remove();
          }, 1000);
        }, 2000);
      }

      function showPopupImageVien4() {
        const imageContainer = document.getElementById("imageContainer");
        const img = document.createElement("img");
        img.src = "images/vien4.jpg";
        img.classList.add("image-popup-vien4");
        imageContainer.appendChild(img);

        // Center confetti at center of viewport
        createConfetti(window.innerWidth / 2, window.innerHeight / 2);

        setTimeout(() => {
          img.style.opacity = 0;
          setTimeout(() => img.remove(), 1000);
        }, 2000);
      }

      // === Flow Functions ===

      function showIntroMessages(index = 0) {
        if (index === 0) {
          resizeCake();
          drawCakeBase();
        }
        if (index >= introMessages.length) {
          startTimer();
          return;
        }
        showPopupText(introMessages[index], popupContainer);
        setTimeout(() => showIntroMessages(index + 1), 3000);
      }

      function startTimer() {
        timerEl.style.display = "block";
        let count = 3;
        timerEl.textContent = count;

        const interval = setInterval(() => {
          count--;
          timerEl.textContent = count;
          if (count <= 0) {
            clearInterval(interval);
            timerEl.style.opacity = 0;
            setTimeout(() => {
              timerEl.remove();
              showMainMessages();
            }, 1000);
          }
        }, 1000);
      }

      function showMainMessages(index = 0) {
        if (index >= mainMessages.length) {
          // After VIEN finishes, show final messages
          setTimeout(() => showFinalMessages(), 2500);
          return;
        }

        showPopupText(mainMessages[index], messageContainer);

        // Draw corresponding topping or candle for each message index
        if (cakeToppings[index]) {
          setTimeout(() => {
            toppingsShown = Math.max(toppingsShown, index + 1);
            withCakeTransform(cakeToppings[index]);
          }, 500);
        }

        setTimeout(() => showMainMessages(index + 1), 2500);
      }

      function showFinalMessages(index = 0) {
        if (index >= finalMessages.length) {
          // After all final messages, show the image
          setTimeout(() => showPopupImage(), 2500);
          return;
        }

        showPopupText(finalMessages[index], messageContainer);
        setTimeout(() => showFinalMessages(index + 1), 2500);
      }

      showIntroMessages();

      // === Audio Controls ===
      const audio = document.getElementById("birthdayAudio");
      const playPauseBtn = document.getElementById("playPauseBtn");
      const muteBtn = document.getElementById("muteBtn");

      playPauseBtn.addEventListener("click", () => {
        if (audio.paused) {
          audio.play();
          playPauseBtn.textContent = "⏸";
          isPaused = false;
          // Resume all animations
          document.body.classList.remove("is-paused");
          document.querySelectorAll(".popup, #messageContainer div, #imageContainer img").forEach(el => {
            el.classList.remove("paused");
          });
        } else {
          audio.pause();
          playPauseBtn.textContent = "▶";
          isPaused = true;
          // Pause all animations
          document.body.classList.add("is-paused");
          document.querySelectorAll(".popup, #messageContainer div, #imageContainer img").forEach(el => {
            el.classList.add("paused");
          });
        }
      });

      muteBtn.addEventListener("click", () => {
        audio.muted = !audio.muted;
        muteBtn.textContent = audio.muted ? "🔇" : "🔊";
      });

      // Initialize mute button to show correct icon (audio starts muted)
      muteBtn.textContent = "🔇";

      // === Handle Resize ===
      window.addEventListener("resize", () => {
        matrixCanvas.width = window.innerWidth;
        matrixCanvas.height = window.innerHeight;
        resizeCake();
        cakeCtx.clearRect(0, 0, cakeCanvas.width, cakeCanvas.height);
        drawCakeBase();
        for (let i = 0; i < toppingsShown; i++) {
          withCakeTransform(cakeToppings[i]);
        }
        confettiCanvas.width = window.innerWidth;
        confettiCanvas.height = window.innerHeight;
      });
    </script>
  </body>
</html>
